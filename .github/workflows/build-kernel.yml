name: build-kernel

on:
  workflow_dispatch:
  push:
    branches: [ droidspace ]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

# 同一个分支只保留最新一次构建，新 run 自动取消旧的
concurrency:
  group: build-kernel-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: arm64
  EXPECTED_KERNELRELEASE: "4.14.355-openela-perf+"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev \
            clang-18 lld-18 llvm-18 python3 make
          # 统一暴露 llvm-18 工具到 PATH (clang/ld.lld/llvm-ar/llvm-nm/...)
          for f in /usr/lib/llvm-18/bin/*; do
            sudo ln -sf "$f" /usr/local/bin/"$(basename "$f")"
          done
          clang --version | head -2

      - name: Configure defconfig
        run: |
          make O=out vendor/flash_lao_com-perf_defconfig

      - name: Assert vermagic matches device
        run: |
          set -e
          REL=$(make O=out -s kernelrelease)
          echo "kernelrelease = [$REL]"
          echo "expected      = [$EXPECTED_KERNELRELEASE]"
          if [ "$REL" != "$EXPECTED_KERNELRELEASE" ]; then
            echo "::error::vermagic mismatch: vendor .ko modules will not load"
            exit 1
          fi
          echo "=== key config sanity ==="
          grep -E '^CONFIG_(PID_NS|IPC_NS|UTS_NS|NET_NS|USER_NS|FHANDLE|CGROUP_PIDS|MODULE_SIG_FORCE|DM_CRYPT|BTRFS_FS|QFMT_V2|MD_RAID1)=' out/.config || true
          grep -q '^CONFIG_PID_NS=y' out/.config || { echo "::error::PID_NS missing (Droidspace needs it)"; exit 1; }
          grep -q '^# CONFIG_MODULE_SIG_FORCE is not set' out/.config || { echo "::error::MODULE_SIG_FORCE still on"; exit 1; }

      - name: Build kernel
        run: |
          make O=out -j"$(nproc)" LLVM=1 Image.gz

      - name: Build modules
        run: |
          make O=out -j"$(nproc)" LLVM=1 modules

      - name: Build fnOS trim_acl_shim.ko (non-blocking)
        continue-on-error: true
        run: |
          make O=out LLVM=1 modules_prepare || true
          make O=out ARCH=arm64 LLVM=1 M="$PWD/fnnas/kmod" modules
          ls -l fnnas/kmod/*.ko || true

      - name: Collect artifacts
        run: |
          mkdir -p artifact
          cp out/arch/arm64/boot/Image.gz artifact/
          cp out/.config artifact/config
          make O=out -s kernelrelease > artifact/kernelrelease.txt
          # 把模块按 vermagic 目录结构收进 tar
          REL=$(cat artifact/kernelrelease.txt)
          make O=out -s INSTALL_MOD_PATH="$PWD/artifact/modstage" modules_install
          (cd artifact/modstage/lib/modules && tar czf "$GITHUB_WORKSPACE/artifact/modules-$REL.tar.gz" .)
          rm -rf artifact/modstage
          # fnOS shim (若编译成功)
          find fnnas/kmod -name '*.ko' -exec cp {} artifact/ \; 2>/dev/null || true
          ls -lh artifact/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ github.sha }}
          path: artifact/
          retention-days: 7
          if-no-files-found: error
