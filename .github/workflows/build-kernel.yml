name: build-kernel

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel tag (e.g. v7.3.6)'
        required: false
        default: 'v7.3.6'
      all_features:
        description: 'Merge configs/features.config (1=yes)'
        required: false
        default: '1'
  push:
    branches: [ mainline ]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: build-mainline-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: arm64
  KVER: ${{ github.event.inputs.kernel_version || 'v7.3.6' }}
  ALL_FEATURES: ${{ github.event.inputs.all_features || '1' }}
  # ---- ccache：每次构建都恢复并使用，不做「命中就跳过编译」的短路。
  #      配置不变时命中率接近 100%；配置一改（autoconf.h 变）则必然全量重编。----
  CCACHE_DIR: /home/runner/.ccache
  CCACHE_MAXSIZE: 3G
  CCACHE_COMPILERCHECK: content
  CCACHE_NOHASHDIR: 1
  CCACHE_SLOPPINESS: time_macros,include_file_ctime,include_file_mtime,file_stat_matches
  CCACHE_BASEDIR: ${{ github.workspace }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout branch (configs / dts / patches)
        uses: actions/checkout@v4

      - name: Compute cache key
        id: bkey
        run: |
          set -e
          FILES="configs/features.config"
          [ -d patches ] && FILES="$FILES $(find patches -type f | sort | tr '\n' ' ')"
          [ -d scripts ] && FILES="$FILES $(find scripts -type f | sort | tr '\n' ' ')"
          [ -d dts ]     && FILES="$FILES $(find dts -type f | sort | tr '\n' ' ')"
          H=$(cat $FILES 2>/dev/null | sha256sum | cut -c1-32)
          echo "hash=$H" >> "$GITHUB_OUTPUT"
          echo "cache key hash = $H"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libdw-dev ccache \
            clang-18 lld-18 llvm-18 python3 make git ca-certificates xz-utils
          for f in /usr/lib/llvm-18/bin/*; do
            sudo ln -sf "$f" /usr/local/bin/"$(basename "$f")"
          done
          clang --version | head -2
          ccache --version | head -1
          df -h /

      # 始终恢复 ccache：精确 key 命中最好，否则用 restore-keys 拿最近一份
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ env.KVER }}-${{ steps.bkey.outputs.hash }}-full
          restore-keys: |
            ccache-${{ env.KVER }}-${{ steps.bkey.outputs.hash }}-
            ccache-${{ env.KVER }}-

      - name: ccache info before build
        run: ccache -s || true

      - name: Fetch mainline kernel ${{ env.KVER }}
        run: |
          set -e
          git clone --depth 1 --branch "$KVER" \
            https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git linux
          cd linux
          git log --oneline -1
          echo "KERNEL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply patches
        run: |
          set -e
          shopt -s nullglob
          for p in patches/*.patch; do
            echo "applying $p"
            ( cd linux && patch -p1 --batch --forward < "../$p" ) || { echo "::error::patch failed: $p"; exit 1; }
          done
          echo "patches applied"

      - name: Install board DTS (if provided)
        run: |
          set -e
          if [ -x scripts/gen-board-dts.sh ]; then
            bash scripts/gen-board-dts.sh linux
          fi
          grep -q 'sm8150-flashlmdd.dtb' linux/arch/arm64/boot/dts/qcom/Makefile || \
            echo 'dtb-$(CONFIG_ARCH_QCOM) += sm8150-flashlmdd.dtb' >> linux/arch/arm64/boot/dts/qcom/Makefile
          tail -3 linux/arch/arm64/boot/dts/qcom/Makefile

      - name: Configure (defconfig + optional features)
        run: |
          set -e
          cd linux
          make O=out LLVM=1 defconfig
          if [ "$ALL_FEATURES" = "1" ] && [ -f ../configs/features.config ]; then
            echo "=== merging configs/features.config ==="
            ./scripts/kconfig/merge_config.sh -O out out/.config ../configs/features.config 2>&1 | tail -40 || true
            make O=out LLVM=1 olddefconfig
          fi
          echo "=== key options ==="
          grep -E '^CONFIG_(ARCH_QCOM|ARCH_SM8150|PINCTRL_SM8150|QCOM_|DRM_MSM|PID_NS|IPC_NS|USER_NS|OVERLAY_FS|BRIDGE|VETH|NETFILTER|CGROUPS|CGROUP_PIDS|SECCOMP|BTRFS_FS|XFS_FS|F2FS_FS|EXFAT_FS|NTFS3_FS|CIFS|NFS_FS|NFSD|FUSE_FS|SQUASHFS|ZRAM|KVM|WIREGUARD|USB_CONFIGFS|UFS_QCOM|PHY_QCOM_QMP_UFS|TYPEC)=' out/.config | sort || true

      - name: Assert 48-bit VA (SM8150 is ARMv8.2-A, no LPA2)
        run: |
          set -e
          CFG=linux/out/.config
          grep -q '^CONFIG_ARM64_VA_BITS_48=y' "$CFG" || { echo "::error::VA_BITS_48 missing"; exit 1; }
          grep -q '^CONFIG_ARM64_VA_BITS=48$' "$CFG" || { echo "::error::VA_BITS != 48"; exit 1; }
          grep -q '^CONFIG_ARM64_PA_BITS_48=y' "$CFG" || { echo "::error::PA_BITS_48 missing"; exit 1; }
          if grep -q '^CONFIG_ARM64_VA_BITS_52=y' "$CFG"; then
            echo "::error::VA_BITS_52 still on -> kernel dies in MMU setup on SM8150"; exit 1
          fi
          if grep -q '^CONFIG_ARM64_LPA2=y' "$CFG"; then
            echo "::error::LPA2 still on (needs ARMv8.7)"; exit 1
          fi
          echo "OK: 48-bit VA/PA, no LPA2"

      - name: Build DTBs first (fail fast)
        run: |
          cd linux
          # 用 `dtbs`：实测全量约 1 分钟，代价很小。
          # 注意不能写 `make arch/arm64/boot/dts/qcom/xxx.dtb` —— kbuild 的
          # Makefile.dtbs 会把 dts 目录再拼一次，变成重复路径而报
          # "No rule to make target 'arch/arm64/boot/dts/arch/arm64/...'"
          make O=out LLVM=1 CC="ccache clang" DTC_FLAGS="-@" -j"$(nproc)" dtbs

      # ------------------------------------------------------------------
      # 第一段：只编内核镜像。这一步决定能否启动，必须尽快出产物。
      # 不编模块，所以通常 10 分钟以内完成。
      # ------------------------------------------------------------------
      - name: Build Image.gz (kernel only, no modules)
        run: |
          cd linux
          # -@ 让 dtc 生成 __symbols__：LG 的 ABL 会把 dtbo 分区叠加到内核 DTB 上，
          # 叠加需要符号表，缺失时 bootloader 可能静默拒绝（fastboot boot 还回 OKAY）。
          make O=out LLVM=1 CC="ccache clang" DTC_FLAGS="-@" -j"$(nproc)" Image.gz

      - name: ccache stats after Image
        run: ccache -s || true

      - name: Assert kernel Image entry is LK-enterable
        run: |
          set -e
          IMG=linux/out/arch/arm64/boot/Image.gz
          [ -f "$IMG" ] || { echo "::error::Image.gz missing"; exit 1; }
          python3 - "$IMG" <<'PY'
          import gzip, struct, sys
          raw = gzip.open(sys.argv[1], "rb").read()
          c0, c1 = struct.unpack_from("<II", raw, 0)
          magic = raw[0x38:0x3C]
          pe_off = struct.unpack_from("<I", raw, 0x3C)[0]
          is_branch = lambda w: (w & 0xFC000000) == 0x14000000
          print(f"code0=0x{c0:08x} code1=0x{c1:08x} magic={magic} pe_header_offset=0x{pe_off:x}")

          if magic != b"ARMd":
              sys.exit("ERROR: ARMd magic missing at 0x38, not an arm64 Image")
          # 我们现在走 edk2-msm UEFI 引导：EFI 镜像（pe_header_offset != 0）是
          # 正确的，由 UEFI 通过 PE 入口启动。LG 的 LK 路径无法进入这种镜像
          # （code1 会跳到 PE stub 的 br x8），但那已经不用了。
          if pe_off != 0:
              if c0 != 0xFA405A4D:
                  sys.exit(f"ERROR: pe_header_offset=0x{pe_off:x} but code0=0x{c0:08x} "
                           "is not the EFI signature -- unexpected image layout")
              print("OK: EFI stub image (boot via edk2-msm UEFI, not LG LK)")
              print(f"    pe_header_offset=0x{pe_off:x}, code1=0x{c1:08x}")
              sys.exit(0)

          # 非 EFI 镜像：LK 路径要求 code0/或 code1 是分支
          if is_branch(c0):
              entry = 0
              print("OK: code0 is a branch")
          elif c0 == 0xD503201F and is_branch(c1):
              entry = 4
              print("OK: code0 is nop, code1 is a branch (standard non-EFI header)")
          else:
              sys.exit(f"ERROR: entry not LK-enterable: code0=0x{c0:08x} code1=0x{c1:08x}")

          w = c0 if entry == 0 else c1
          imm = w & 0x03FFFFFF
          if imm & 0x02000000:
              imm -= 0x04000000
          target = entry + imm * 4
          print(f"entry at offset {entry}, branch target = 0x{target:x} "
                f"(image size 0x{len(raw):x})")
          if not (0 <= target < len(raw) - 16):
              sys.exit(f"ERROR: branch target 0x{target:x} outside the image")
          at = raw[target:target + 16]
          print(f"bytes at target: {at.hex(' ')}")
          if at[:4] == b"\x00\x00\x00\x00":
              sys.exit("ERROR: branch target points at zeros")
          if struct.unpack_from("<I", at, 0)[0] == 0xD61F0100:
              sys.exit("ERROR: branch target is `br x8` (PE/EFI stub entry)")
          print("OK: entry is LK-enterable")
          PY

      - name: DTB gate (ufshc/phy must be okay)
        run: |
          set -e
          DTB=linux/out/arch/arm64/boot/dts/qcom/sm8150-flashlmdd.dtb
          [ -f "$DTB" ] || { echo "::error::board dtb not built"; exit 1; }
          bash scripts/check-dtb.sh "$DTB" | tee dtb-gate.log

      - name: Collect kernel artifacts
        run: |
          set -e
          mkdir -p artifact-kernel/dtb
          cp linux/out/arch/arm64/boot/Image.gz artifact-kernel/
          cp linux/out/.config artifact-kernel/config
          echo "$KERNEL_COMMIT" > artifact-kernel/kernel_commit.txt
          echo "$KVER" > artifact-kernel/kernel_version.txt
          find linux/out/arch/arm64/boot/dts/qcom -maxdepth 1 -name 'sm8150*.dtb' -exec cp {} artifact-kernel/dtb/ \; 2>/dev/null || true
          ls -lh artifact-kernel artifact-kernel/dtb

      - name: Upload kernel artifact (available immediately)
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.KVER }}-${{ github.sha }}
          path: artifact-kernel
          if-no-files-found: error

      # 内核一编完就保存缓存：即使后面模块编挂了也不会丢
      - name: Save ccache after kernel
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ env.KVER }}-${{ steps.bkey.outputs.hash }}-img

      # ------------------------------------------------------------------
      # 第二段：模块。慢，而且首启验证用不到，所以放在后面且允许失败，
      # 绝不能因为它卡住内核迭代。
      # ------------------------------------------------------------------
      - name: Build modules (slow, non-blocking)
        id: mods
        continue-on-error: true
        run: |
          cd linux
          make O=out LLVM=1 CC="ccache clang" -j"$(nproc)" modules

      - name: Collect module artifacts
        if: steps.mods.outcome == 'success'
        run: |
          set -e
          mkdir -p artifact-modules
          make -C linux O=out -s INSTALL_MOD_PATH="$PWD/modstage" modules_install >/dev/null 2>&1 || true
          if [ -d modstage/lib/modules ]; then
            ( cd modstage/lib/modules && tar czf "$GITHUB_WORKSPACE/artifact-modules/modules-$KVER.tar.gz" . )
          fi
          ls -lh artifact-modules

      - name: Upload modules artifact
        if: steps.mods.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: modules-${{ env.KVER }}-${{ github.sha }}
          path: artifact-modules
          if-no-files-found: warn

      - name: Save ccache after modules
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ env.KVER }}-${{ steps.bkey.outputs.hash }}-full
