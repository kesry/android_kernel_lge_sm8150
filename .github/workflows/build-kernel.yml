name: build-kernel

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel tag (e.g. v7.3.6)'
        required: false
        default: 'v7.3.6'
      all_features:
        description: 'Merge configs/features.config (1=yes)'
        required: false
        default: '1'
  push:
    branches: [ mainline ]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: build-mainline-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: arm64
  KVER: ${{ github.event.inputs.kernel_version || 'v7.3.6' }}
  ALL_FEATURES: ${{ github.event.inputs.all_features || '1' }}
  # ---- ccache：避免每次全量重编（一次全量约 40 分钟，命中缓存后可降到几分钟）----
  CCACHE_DIR: /home/runner/.ccache
  CCACHE_MAXSIZE: 3G
  CCACHE_COMPILERCHECK: content
  CCACHE_NOHASHDIR: 1
  CCACHE_SLOPPINESS: time_macros,include_file_ctime,include_file_mtime,file_stat_matches
  CCACHE_BASEDIR: ${{ github.workspace }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout branch (configs / dts / patches)
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libdw-dev ccache \
            clang-18 lld-18 llvm-18 python3 make git ca-certificates xz-utils
          for f in /usr/lib/llvm-18/bin/*; do
            sudo ln -sf "$f" /usr/local/bin/"$(basename "$f")"
          done
          clang --version | head -2
          ccache --version | head -1
          df -h /

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          # key 只跟「内核版本 + 配置/补丁/脚本」有关：
          # 只改 DTS 或文档时命中率极高，几乎不用重编
          key: ccache-${{ env.KVER }}-${{ hashFiles('configs/features.config', 'patches/**', 'scripts/**') }}
          restore-keys: |
            ccache-${{ env.KVER }}-

      - name: ccache info before build
        run: ccache -s || true

      - name: Fetch mainline kernel ${{ env.KVER }}
        run: |
          set -e
          git clone --depth 1 --branch "$KVER" \
            https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git linux
          cd linux
          echo "commit=$(git rev-parse HEAD)"
          echo "KERNEL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply patches
        run: |
          set -e
          shopt -s nullglob
          pats=(patches/*.patch)
          [ ${#pats[@]} -eq 0 ] && { echo "no patches"; exit 0; }
          cd linux
          for p in ../patches/*.patch; do
            echo "=== $(basename "$p")"
            patch -p1 --batch --forward < "$p" || { echo "::error::patch failed: $p"; exit 1; }
          done

      - name: Install board DTS (if provided)
        run: |
          set -e
          # 1) 仓库里自带的 dts（如果以后要完全自写）
          shopt -s nullglob
          dtsfiles=(dts/*.dts)
          dtifiles=(dts/*.dtsi)
          if [ ${#dtsfiles[@]} -gt 0 ] || [ ${#dtifiles[@]} -gt 0 ]; then
            cp dts/*.dts dts/*.dtsi linux/arch/arm64/boot/dts/qcom/ 2>/dev/null || true
          fi
          # 2) 由上游 sm8150-mtp + V50 增量生成板级 DTS
          if [ -f scripts/gen-board-dts.sh ]; then
            bash scripts/gen-board-dts.sh "$PWD/linux"
          fi
          cd linux/arch/arm64/boot/dts/qcom
          # 只把我们的板子加进 Makefile，不要把目录里几百个 dts 全加进去
          grep -q "sm8150-flashlmdd.dtb" Makefile || \
            echo 'dtb-$(CONFIG_ARCH_QCOM) += sm8150-flashlmdd.dtb' >> Makefile
          grep -n "flashlmdd" Makefile || true

      - name: Configure (defconfig + optional feature fragment)
        run: |
          set -e
          cd linux
          make O=out LLVM=1 defconfig
          if [ "$ALL_FEATURES" = "1" ] && [ -f ../configs/features.config ]; then
            echo "=== merging configs/features.config ==="
            ./scripts/kconfig/merge_config.sh -O out out/.config ../configs/features.config 2>&1 | tail -40 || true
            make O=out LLVM=1 olddefconfig
          fi
          echo "=== key options ==="
          grep -E '^CONFIG_(ARCH_QCOM|ARCH_SM8150|PINCTRL_SM8150|QCOM_|DRM_MSM|PID_NS|IPC_NS|USER_NS|OVERLAY_FS|BRIDGE|VETH|NETFILTER|CGROUPS|CGROUP_PIDS|SECCOMP|BTRFS_FS|XFS_FS|F2FS_FS|EXFAT_FS|NTFS3_FS|CIFS|NFS_FS|NFSD|FUSE_FS|SQUASHFS|ZRAM|KVM|WIREGUARD|USB_CONFIGFS|UFS_QCOM|PHY_QCOM_QMP_UFS|TYPEC)=' out/.config | sort || true

      - name: Build DTBs first (fail fast)
        run: |
          cd linux
          # 用 `dtbs`：实测全量约 1 分钟，代价很小。
          # 注意不能写 `make arch/arm64/boot/dts/qcom/xxx.dtb` —— kbuild 的
          # Makefile.dtbs 会把 dts 目录再拼一次，变成重复路径而报
          # "No rule to make target 'arch/arm64/boot/dts/arch/arm64/...'"
          make O=out LLVM=1 CC="ccache clang" DTC_FLAGS="-@" -j"$(nproc)" dtbs

      - name: DTB gate (ufshc/phy must be okay)
        run: |
          set -e
          DTB=linux/out/arch/arm64/boot/dts/qcom/sm8150-flashlmdd.dtb
          [ -f "$DTB" ] || { echo "::error::board dtb not built"; exit 1; }
          bash scripts/check-dtb.sh "$DTB" | tee dtb-gate.log

      - name: Build Image.gz + modules
        run: |
          cd linux
          # -@ 让 dtc 生成 __symbols__：LG 的 ABL 会把 dtbo 分区叠加到内核 DTB 上，
          # 叠加需要符号表，缺失时 bootloader 可能静默拒绝（fastboot boot 还回 OKAY）。
          make O=out LLVM=1 CC="ccache clang" DTC_FLAGS="-@" -j"$(nproc)" Image.gz modules

      - name: ccache stats after build
        run: ccache -s || true

      - name: Collect artifacts
        run: |
          set -e
          mkdir -p artifact/dtb
          cp linux/out/arch/arm64/boot/Image.gz artifact/
          cp linux/out/.config artifact/config
          echo "$KERNEL_COMMIT" > artifact/kernel_commit.txt
          echo "$KVER" > artifact/kernel_version.txt
          find linux/out/arch/arm64/boot/dts/qcom -maxdepth 1 -name 'sm8150*.dtb' -exec cp {} artifact/dtb/ \; 2>/dev/null || true
          # 模块清单（体积大，只给清单和 tar.gz 名称）
          make -C linux O=out -s INSTALL_MOD_PATH="$PWD/modstage" modules_install >/dev/null 2>&1 || true
          if [ -d modstage/lib/modules ]; then
            ( cd modstage/lib/modules && tar czf "$GITHUB_WORKSPACE/artifact/modules-$(cat "$GITHUB_WORKSPACE/artifact/kernel_version.txt").tar.gz" . ) || true
          fi
          ls -lh artifact; ls -lh artifact/dtb || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mainline-${{ env.KVER }}-${{ github.sha }}
          path: artifact/
          retention-days: 7
          if-no-files-found: error
